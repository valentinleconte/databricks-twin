bundle:
  name: agent_langgraph

resources:
  apps:
    agent_langgraph:
      name: "agent-databricks-twin"
      description: "LangGraph agent application"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: GENIE_SPACE_ID
            value: "01f1a032e846136bb82ee33eb3e6a582"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "168280437378767"
            permission: 'CAN_MANAGE'
        - name: 'doc_search_index'
          uc_securable:
            securable_full_name: 'workspace.databricks_twin.doc_chunks_index'
            securable_type: 'TABLE'
            permission: 'SELECT'
        - name: 'support_tickets_genie'
          genie_space:
            name: 'Support Ticket Management'
            space_id: '01f1a032e846136bb82ee33eb3e6a582'
            permission: 'CAN_RUN'
        # CAN_RUN on the genie_space above lets the service principal *ask* the space, but Genie
        # then executes the generated SQL with the caller's own UC rights on the underlying table
        # — a separate grant chain, not implied by the genie_space permission. Found the hard way
        # in prod (see NOTES.md): local testing didn't catch it because it ran as an already-
        # privileged user account, not the app's service principal.
        #
        # This declares the TABLE-level SELECT (the bundle's uc_securable resource only supports
        # securable_type CONNECTION/FUNCTION/TABLE/VOLUME — confirmed via `bundle validate`, which
        # rejects CATALOG/SCHEMA). The USE CATALOG / USE SCHEMA grants Genie also needs have no
        # declarative equivalent here — they're applied via plain SQL in
        # scripts/twin/setup_resources.py instead, run once against the workspace.
        - name: 'support_tickets_table'
          uc_securable:
            securable_full_name: 'workspace.databricks_twin.support_tickets'
            securable_type: 'TABLE'
            permission: 'SELECT'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_langgraph:
          name: agent-databricks-twin
